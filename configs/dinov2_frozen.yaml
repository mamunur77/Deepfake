# ═══════════════════════════════════════════════════════════════════
# UniversalFakeDetect-Style DINOv2-ViT-B/14 (Frozen Backbone + Hyperspherical Head)
# ═══════════════════════════════════════════════════════════════════

experiment:
  name: "dinov2_frozen"
  seed: 42
  output_dir: "outputs"

data:
  dataset: "auto"
  split_dir: "data/splits"
  mode: "image"
  img_size: 224
  num_workers: 4

model:
  backbone: "dinov2_vitb14"
  pretrained: true
  mode: "frozen"                    # linear probe: backbone frozen, train head only
  normalize_features: true          # L2 hyperspherical projection to prevent dataset memorization
  num_classes: 1
  drop_rate: 0.1

training:
  epochs: 20
  batch_size: 64
  lr: 1.0e-3                        # optimal learning rate for linear probe
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 2
  early_stopping_patience: 6
  mixed_precision: true
  loss_type: "focal"                # Focuses on hard ambiguous samples rather than easy shortcuts
  label_smoothing: 0.05
  focal_gamma: 2.0
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  gradient_checkpointing: false

debug:
  enabled: false
  max_samples: 50
  epochs: 1
  batch_size: 4
