# ═══════════════════════════════════════════════════════════════════
# DINOv2-ViT-B/14 Partial Fine-Tuning (Unfreeze Last 4 Blocks)
# ═══════════════════════════════════════════════════════════════════

experiment:
  name: "dinov2_partial"
  seed: 42
  output_dir: "outputs"

data:
  dataset: "faceforensics"
  split_dir: "data/splits"
  mode: "image"
  img_size: 224
  num_workers: 4

model:
  backbone: "dinov2_vitb14"
  pretrained: true
  mode: "partial"                   # unfreeze last K blocks + norm + head
  unfreeze_blocks: 4
  num_classes: 1
  drop_rate: 0.1

training:
  epochs: 25
  batch_size: 32
  lr: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 3
  early_stopping_patience: 5
  mixed_precision: true
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  gradient_checkpointing: false

debug:
  enabled: false
  max_samples: 50
  epochs: 1
  batch_size: 4
